name: Private TV bridge safety tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-read-only-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test approved requests and rejected inputs
        run: |
          python -m py_compile scripts/cleanyourtv_boxy_maintenance.py scripts/cleanyourtv_provider_files.py scripts/cleanyourtv_remote_preset.py scripts/boxy_minimal_wallpaper.py scripts/cleanyourtv_perf_probe.py tv_bridge_v2.py
          python -m unittest -v test_tv_bridge.py test_tv_bridge_v2.py tests/test_cleanyourtv_maintenance.py tests/test_cleanyourtv_remote_preset.py tests/test_cleanyourtv_perf_probe.py tests/test_cleanyourtv_provider_theme.py tests/test_boxy_minimal_wallpaper.py
