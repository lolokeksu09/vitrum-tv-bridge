name: Build CleanYourTV for BOXY

on:
  push:
    paths:
      - .github/workflows/build-cleanyourtv-boxy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pinned official CleanYourTV v3.5.0 source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: d11bd68c9ac45b2fb38480941586d17930137e9d
          path: upstream
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build and unit test official launcher
        working-directory: upstream/launcher
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --no-daemon --console=plain

      - name: Check APK and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sha256sum "$apk" | tee cleanyourtv-boxy.sha256
          echo "CleanYourTV v3.5.0"
          echo "Source commit: d11bd68c9ac45b2fb38480941586d17930137e9d"
          ls -lh "$apk"

      - name: Upload version-pinned APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-BOXY-v3.5.0
          path: |
            upstream/launcher/app/build/outputs/apk/release/app-release.apk
            cleanyourtv-boxy.sha256
          if-no-files-found: error
          retention-days: 30
