name: BOXY Agent — build test APK
on:
  push:
    branches: [main, 'feature/boxy-on-device-agent-v0']
    paths:
      - 'boxy-agent/**'
      - '.github/workflows/build-boxy-agent.yml'
  pull_request:
    paths:
      - 'boxy-agent/**'
      - '.github/workflows/build-boxy-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build BOXY Android TV agent
        working-directory: boxy-agent
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boxy-agent-debug-apk
          path: boxy-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
