name: CleanYourTV BOXY preset validation

on:
  pull_request:
    paths:
      - presets/cleanyourtv-boxy/config.json
      - docs/CLEANYOURTV-BOXY-PRESET.md
      - .github/workflows/test-cleanyourtv-theme.yml
  push:
    branches: [main]
    paths:
      - presets/cleanyourtv-boxy/config.json
      - docs/CLEANYOURTV-BOXY-PRESET.md
      - .github/workflows/test-cleanyourtv-theme.yml

permissions:
  contents: read

jobs:
  verify-preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and reversible preset boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('presets/cleanyourtv-boxy/config.json').read_text())
          assert cfg["columns"] == 4
          assert cfg["background_color"] == "#000000"
          assert cfg["rows_below_dock"] == 1  # positions dock centrally, single_row hides lower grid
          assert cfg["single_row"] is True
          assert cfg["dock_title"] is False
          assert cfg["ambient_glow"] is False
          assert cfg["sky_intensity"] == 0
          assert cfg["wallpaper"] is True
          assert cfg["show_greeting"] is True
          assert cfg["icon_only_buttons"] is False
          assert cfg["dock_opacity"] == 78
          assert cfg["dock_apps"] == ["com.google.android.youtube.tv", "com.vk.tv", "com.v2ray.ang", "com.tcl.browser"]
          assert "hidden_apps" not in cfg
          assert "vpn_app" not in cfg
          print('OLED preset, horizontal app access and dock package invariants verified.')
          PY
