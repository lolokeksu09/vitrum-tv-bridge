name: BOXY CleanYourTV inventory safety checks

on:
  pull_request:
    paths:
      - scripts/audit-cleanyourtv-boxy.py
      - tests/test_audit_cleanyourtv_boxy.py
      - .github/workflows/test-cleanyourtv-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/audit-cleanyourtv-boxy.py
      - tests/test_audit_cleanyourtv_boxy.py
      - .github/workflows/test-cleanyourtv-audit.yml

permissions:
  contents: read

jobs:
  audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test without real ADB or GitHub network calls
        run: |
          python3 -m py_compile scripts/audit-cleanyourtv-boxy.py tests/test_audit_cleanyourtv_boxy.py
          python3 -m unittest -v tests/test_audit_cleanyourtv_boxy.py
