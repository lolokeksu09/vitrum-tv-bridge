name: Build Scrcpy RU APK

on:
  push:
    branches:
      - build/scrcpy-ru-20261114
      - feature/scrcpy-profiles-v1
      - feature/scrcpy-settings-v2
    paths:
      - '.github/workflows/build-scrcpy-ru.yml'
      - 'scrcpy-ru/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build translated Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout localization
        uses: actions/checkout@v4
      - name: Checkout pinned upstream
        shell: bash
        run: |
          git clone https://github.com/sw3gmach1n3/Scrcpy_for_Android.git android_source
          cd android_source
          git checkout --detach d4a9a8caaaf8f0ff21ca6e3a3a406224b9116dd3
      - name: Apply complete localization
        shell: bash
        run: |
          python3 scrcpy-ru/apply_to_source.py android_source
          python3 scrcpy-ru/profiles/apply_profiles.py android_source
          python3 scrcpy-ru/settings/apply_settings.py android_source
          python3 scrcpy-ru/settings/check_settings.py android_source
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('android_source/app/src/main/res')
          files=[root/f'values{x}/strings.xml' for x in ('','-ro','-ru')]
          for file in files:
              doc=ET.parse(file).getroot()
              names={e.get('name') for e in doc}
              if len(names)!=367 or 'app_name' not in names:
                  raise SystemExit(f'Invalid localization resource: {file} ({len(names)} strings)')
              text=file.read_text(encoding='utf-8')
              before='<string name="app_name" formatted="false">"Scrcpy"</string>'
              assert text.count(before)==1, f'Unexpected label in {file}'
              file.write_text(text.replace(before,'<string name="app_name" formatted="false">"Scrcpy RU Settings"</string>'),encoding='utf-8')
          gradle=pathlib.Path('android_source/app/build.gradle')
          s=gradle.read_text(encoding='utf-8')
          before="applicationId 'ro.sw3g.scrcpy'"
          assert s.count(before)==1
          gradle.write_text(s.replace(before,"applicationId 'ro.sw3g.scrcpy.ru.settings'"),encoding='utf-8')
          gradle=pathlib.Path('android_source/app/build.gradle')
          version=gradle.read_text(encoding='utf-8')
          assert version.count('versionCode 9')==1 and version.count("versionName '1.5.1-foreground-usb'")==1
          gradle.write_text(version.replace('versionCode 9','versionCode 11').replace("versionName '1.5.1-foreground-usb'","versionName '1.7.0-settings-v2'"),encoding='utf-8')
          print('Settings and profiles validated; separate test package ro.sw3g.scrcpy.ru.settings')
          PY
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35 using preinstalled SDK
        shell: bash
        run: |
          set -e
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests (ProfileCodec)
        working-directory: android_source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          cases=sum(int(ET.parse(f).getroot().get('tests','0')) for f in files)
          failures=sum(int(ET.parse(f).getroot().get('failures','0'))+int(ET.parse(f).getroot().get('errors','0')) for f in files)
          print(f'Unit tests: {cases}, failed/error: {failures}')
          if cases<14 or failures: raise SystemExit('Required Profiles tests missing or failing')
          PY
      - name: Build debug APK
        working-directory: android_source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -Pandroid.injected.testOnly=false
      - name: Verify APK and calculate digest
        shell: bash
        run: |
          set -e
          APK=android_source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" Scrcpy-RU-Settings-1.7.0-debug.apk
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          sha256sum Scrcpy-RU-Settings-1.7.0-debug.apk >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scrcpy-RU-Settings-APK
          path: Scrcpy-RU-Settings-1.7.0-debug.apk
          if-no-files-found: error
