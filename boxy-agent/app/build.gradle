plugins { id 'com.android.application' }

android {
    namespace 'dev.lolokeksu.boxyagent'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.lolokeksu.boxyagent'
        minSdk 26
        targetSdk 30
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
